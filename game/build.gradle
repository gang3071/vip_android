plugins {

    id 'com.android.application'
}

android {
    compileSdk 34
//    buildToolsVersion "30.0.3"
    namespace 'com.timego.game'

    defaultConfig {
        applicationId "com.timego.gamecontainer"
        minSdk 21
        targetSdk 34
        versionCode 115
        versionName "1.1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters  'arm64-v8a'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    signingConfigs {
        debug {
            storeFile file('jiyoukey')
            storePassword "123456"
            keyAlias 'jiyou'
            keyPassword "123456"
        }
        release {
            storeFile file('jiyoukey')
            storePassword "123456"
            keyAlias 'jiyou'
            keyPassword "123456"
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    viewBinding {
        enabled = true
    }
    dexOptions {
        javaMaxHeapSize "4g"
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

    api 'android.arch.lifecycle:extensions:1.1.1'
    api 'com.squareup.retrofit2:retrofit:2.5.0'
    api 'com.squareup.retrofit2:converter-scalars:2.3.0'
    api 'com.squareup.retrofit2:converter-gson:2.4.0'
    api 'com.squareup.retrofit2:adapter-rxjava2:2.4.0'
    api 'io.reactivex.rxjava2:rxjava:2.1.16'
    api 'io.reactivex.rxjava2:rxandroid:2.0.2'
    implementation("com.tencent.bugly:crashreport:4.0.4")
    implementation("androidx.webkit:webkit:1.14.0")
    implementation'com.github.Justson.AgentWeb:agentweb-core:v5.0.6-androidx' // (必选)
    implementation 'com.github.Justson.AgentWeb:agentweb-filechooser:v5.0.6-androidx' // (可选)
    implementation ("org.mozilla.geckoview:geckoview-nightly:120.0.20231006092133")
    implementation 'com.squareup.okhttp3:logging-interceptor:3.10.0'
    implementation 'com.github.jenly1314.AppUpdater:app-updater:1.1.3'

}