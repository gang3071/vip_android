plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
//    buildToolsVersion "30.0.3"
    namespace 'com.timego.calculcator'

    defaultConfig {
        applicationId "com.timego.calculcator"
        minSdk 21
        targetSdk 34
        versionCode 119
        versionName "1.1.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    signingConfigs {
        debug {
            storeFile file('jiyoukey')
            storePassword "123456"
            keyAlias 'jiyou'
            keyPassword "123456"
        }
        release {
            storeFile file('jiyoukey')
            storePassword "123456"
            keyAlias 'jiyou'
            keyPassword "123456"
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    viewBinding {
        enabled = true
    }
    dexOptions {
        javaMaxHeapSize "4g"
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation files('libs\\tbs_sdk_thirdapp_v4.3.0.386_44286_20230210.jar')
    implementation files('libs\\ZtlApi.jar')

    // okhttp相关库
//    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

    // JSON解析库
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.alibaba:fastjson:1.1.71.android'
    api 'android.arch.lifecycle:extensions:1.1.1'
    api 'com.squareup.retrofit2:retrofit:2.5.0'
    api 'com.squareup.retrofit2:converter-scalars:2.3.0'
    api 'com.squareup.retrofit2:converter-gson:2.4.0'
    api 'com.squareup.retrofit2:adapter-rxjava2:2.4.0'
    api 'io.reactivex.rxjava2:rxjava:2.1.16'
    api 'io.reactivex.rxjava2:rxandroid:2.0.2'
    implementation("com.tencent.bugly:crashreport:4.0.4")

    implementation 'com.squareup.okhttp3:logging-interceptor:3.10.0'
    implementation 'com.github.Justson.AgentWeb:agentweb-core:v5.0.6-androidx' // (必选)
    implementation 'com.github.Justson.AgentWeb:agentweb-filechooser:v5.0.6-androidx' // (可选)
//    implementation 'com.github.Justson:Downloader:v5.0.4-androidx'
//    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.github.jenly1314:zxing-lite:2.1.1'
    implementation("com.github.lzyzsd:jsbridge:1.0.4")
    implementation("com.smallbuer:jsbridge:1.0.7")
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'
    implementation 'com.github.jenly1314.AppUpdater:app-updater:1.1.3'
    implementation("androidx.webkit:webkit:1.14.0")
//    implementation ("org.mozilla.geckoview:geckoview-nightly:120.0.20231006092133")
    implementation 'com.github.maybesix:Android-XHLibrary:v1.0.0' //ttysx

}